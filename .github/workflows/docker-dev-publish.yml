name: Publish dev images

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-migrations:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: darttournament
          POSTGRES_USER: dartuser
          POSTGRES_PASSWORD: change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dartuser -d darttournament"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install backend dependencies
        run: npm install
        working-directory: backend

      - name: Apply migrations
        run: npm run db:migrate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://dartuser:change-me@localhost:5432/darttournament

      - name: Roll back latest migration
        run: npm run db:rollback
        working-directory: backend
        env:
          DATABASE_URL: postgresql://dartuser:change-me@localhost:5432/darttournament

      - name: Reapply migrations
        run: npm run db:migrate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://dartuser:change-me@localhost:5432/darttournament

  build-and-push:
    runs-on: ubuntu-24.04
    needs: validate-migrations

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/darttournament-backend:dev

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/darttournament-frontend:dev

      - name: Build and push broadcasting
        uses: docker/build-push-action@v6
        with:
          context: ./broadcasting
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/darttournament-broadcasting:dev
